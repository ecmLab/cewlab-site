# CEW Lab roster.
#
# Recovered from the live cewlab.org /team page (last published 2024-12-02) — the richest
# roster on record. The live site listed names and groupings only: no titles, topics, or
# links. Those fields are left blank here rather than guessed; fill them in and they render
# automatically.
#
# To add someone: copy a block into the right group. `photo` is a filename in
# assets/img/team/ — omit it and the navy placeholder is used.
# `_placeholder.jpg` is intentional for the 13 members with no headshot on file.

