# CEW Lab roster.
#
# Two sources, reconciled:
#   - the live cewlab.org /team page (published 2024-12-02) — groupings and the alumni list
#   - the tenure package drafts (revised 2026-08-16) — levels and project topics
# Where they disagree the tenure package wins, being ~20 months newer. It moves
# Joseph Vazquez Mercado from undergraduate to PhD student.
#
# NOT added: Ashok Gurung, named as a co-author but never explicitly identified as an
# advisee. The tenure package's own CV changelog warns that listing a non-advisee as
# your student is worse than listing none, so he is left out pending confirmation.
#
# To add someone: copy a block into the right group. `photo` is a filename in
# assets/img/team/ — omit it and the navy placeholder is used.

